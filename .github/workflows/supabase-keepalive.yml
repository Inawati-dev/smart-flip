name: Supabase Keep-Alive

# Paket Free Supabase menjeda proyek yang tidak ada permintaan API selama 7 hari.
# Satu permintaan per hari mencegahnya (antrean #395). Bukan pengganti cadangan data.

on:
  schedule:
    - cron: '17 3 * * *'   # tiap hari 03:17 UTC (10:17 WIB)
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Rahasia SUPABASE_URL / SUPABASE_ANON_KEY belum dipasang"; exit 1
          fi
          # --fail: kode 4xx/5xx membuat job merah, GitHub mengirim email ke pemilik repo
          curl --fail --silent --show-error --max-time 30 --retry 3 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" -o /dev/null -w "HTTP %{http_code}\n"
